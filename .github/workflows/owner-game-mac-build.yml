name: Owner Game Mac Build

on:
  workflow_dispatch:
  push:
    branches:
      - owner-game-live-bridge
      - owner-game-p0-integration-tests
      - owner-game-contract-lifecycle
      - owner-game-offer-roundtrip

# Allow the currently running baseline Mac build to finish before the next
# commit's integration gate. Keep known-good branches independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-15-intel

    steps:
      - name: Get Bosman source
        uses: actions/checkout@v4

      - name: Install Python Capstone
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install capstone
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download official Bosman 0.6.0 Mac game files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0 \
            --repo maxevans60/cm0102-bosman-edition \
            --pattern "CM-01-02-Bosman-Edition-0.6.0-mac.dmg" \
            --output bosman-0.6.0.dmg

          hdiutil attach bosman-0.6.0.dmg -nobrowse -readonly
          APP=$(find /Volumes -maxdepth 2 -name "CM 01-02 Bosman Edition.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "Could not find Bosman app in mounted DMG"
            exit 1
          fi

          ditto "$APP/Contents/Resources/game" "$GITHUB_WORKSPACE/game"

          test -f "$GITHUB_WORKSPACE/game/cm0102.exe"
          test -d "$GITHUB_WORKSPACE/game/Data"

          hdiutil detach "$(dirname "$APP")"

      # SDL2 is pinned; reuse both architecture builds between commits.
      # GitHub Actions cache content is restored before any dependent build step.
      - name: Restore pinned universal SDL2 build
        id: sdl2-cache
        uses: actions/cache@v4
        with:
          path: |
            sdl2-arm64
            sdl2-x86_64
          key: owner-game-macos15-intel-sdl2-2.32.10-${{ hashFiles('tools/mac/build_sdl2.sh') }}

      - name: Set up compiler cache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi
          ccache --version

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: owner-game-macos15-intel-ccache-v1-${{ github.sha }}
          restore-keys: |
            owner-game-macos15-intel-ccache-v1-

      - name: Download SDL2 source
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        run: |
          curl -L \
            -o SDL2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          tar -xzf SDL2.tar.gz

      - name: Build universal SDL2
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        run: |
          tools/mac/build_sdl2.sh \
            "$GITHUB_WORKSPACE/SDL2-2.32.10" \
            "$GITHUB_WORKSPACE/sdl2-arm64" \
            arm64

          tools/mac/build_sdl2.sh \
            "$GITHUB_WORKSPACE/SDL2-2.32.10" \
            "$GITHUB_WORKSPACE/sdl2-x86_64" \
            x86_64

      - name: Build Owner Game Bosman Mac app
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
        run: |
          set +e
          tools/mac/make_app.sh \
            --game "$GITHUB_WORKSPACE/game" \
            --sdl2-arm64 "$GITHUB_WORKSPACE/sdl2-arm64" \
            --sdl2-x86_64 "$GITHUB_WORKSPACE/sdl2-x86_64" \
            --out "$GITHUB_WORKSPACE/build-owner-mac"
          result=$?
          set -e
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          test -f "$APP/Contents/MacOS/cm0102_recomp"
          test -d "$APP/Contents/Resources/game/Data"
          if [ "$result" -ne 0 ]; then
            echo "DMG creation failed after successful app build; publishing complete Mac app ZIP instead."
          fi
          cd "$GITHUB_WORKSPACE/build-owner-mac"
          ditto -c -k --sequesterRsrc --keepParent "CM 01-02 Bosman Edition.app" Owner-Game-Mac-Complete.zip
          test -s Owner-Game-Mac-Complete.zip

      - name: Verify universal Owner Game bridge
        run: |
          APP_BIN="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app/Contents/MacOS/cm0102_recomp"
          test -f "$APP_BIN"
          lipo -info "$APP_BIN"
          file "$APP_BIN"
          strings "$APP_BIN" | grep -q "owner-game-state.json"
          strings "$APP_BIN" | grep -q "owner-game-command.txt"
          ls -lh "$GITHUB_WORKSPACE"/build-owner-mac/Owner-Game-Mac-Complete.zip
          test -d "$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app/Contents/Resources/game/Data"

      - name: Owner Game real Arsenal save and reload smoke
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/bridge_smoke.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      - name: Manager Desk owner command must arm and cancel native one-match delegation
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/manager_desk_native_commands.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      - name: Prove contract trace does not change native football saves
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/contract_trace_parity.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      - name: Manager Desk native market observer must preserve football saves
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/manager_trace_parity.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      - name: Verify native submitted offer survives reload and pending readback
        if: github.ref == 'refs/heads/owner-game-offer-roundtrip'
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/offer_roundtrip.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      - name: Verify delayed native contract resolution and second reload
        if: github.ref == 'refs/heads/owner-game-offer-roundtrip'
        run: |
          set -eu
          APP="$GITHUB_WORKSPACE/build-owner-mac/CM 01-02 Bosman Edition.app"
          python3 tests/owner_game/offer_delayed_lifecycle.py \
            "$APP/Contents/MacOS/cm0102_recomp" \
            "$APP/Contents/Resources/game"

      # Ship ONE Mac installer, not both duplicate .dmg and .zip copies.
      # The independent user guide accompanies the installer in the artifact.
      - name: Assemble Owner Game Holiday Mac download
        run: |
          set -eu
          mkdir -p build-owner-mac/holiday-release
          cp docs/owner-game/HOLIDAY_EDITION_2026-11-24.md \
            build-owner-mac/holiday-release/READ-ME-FIRST.txt
          DMG=$(find build-owner-mac -maxdepth 1 -type f -name '*.dmg' -print -quit)
          if [ -n "$DMG" ] && [ -s "$DMG" ]; then
            cp "$DMG" build-owner-mac/holiday-release/Owner-Game-Holiday-Mac.dmg
            echo "Publishing complete installable Mac DMG"
          else
            cp build-owner-mac/Owner-Game-Mac-Complete.zip \
              build-owner-mac/holiday-release/Owner-Game-Mac-Complete.zip
            echo "Publishing complete Mac app ZIP fallback"
          fi
          find build-owner-mac/holiday-release -maxdepth 1 -type f -print
          test "$(find build-owner-mac/holiday-release -maxdepth 1 \
            \( -name '*.dmg' -o -name '*.zip' \) | wc -l | tr -d ' ')" -eq 1

      - name: Save Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Owner-Game-Holiday-Mac
          path: build-owner-mac/holiday-release/*
          if-no-files-found: error
          retention-days: 90
