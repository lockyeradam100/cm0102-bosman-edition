name: Owner Game Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - owner-game-live-bridge

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Get Bosman source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            mingw-w64 \
            p7zip-full \
            python3-venv \
            nsis \
            curl

      - name: Install Python Capstone
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install capstone

      - name: Download official Bosman 0.6.0 game files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0 \
            --repo maxevans60/cm0102-bosman-edition \
            --pattern "CM0102-Bosman-Edition-0.6.0-Setup.exe" \
            --output bosman-setup.exe

          mkdir extracted
          7z x bosman-setup.exe -oextracted -y >/dev/null

          GAME_EXE=$(find extracted -type f -iname "cm0102.exe" | head -1)

          if [ -z "$GAME_EXE" ]; then
            echo "Could not find cm0102.exe"
            exit 1
          fi

          echo "GAME_EXE=$GAME_EXE" >> "$GITHUB_ENV"
          echo "Found game executable: $GAME_EXE"

      - name: Download Windows SDL2
        run: |
          curl -L \
            -o SDL2-devel.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz

          tar -xzf SDL2-devel.tar.gz

          echo "SDL2_DIR=$GITHUB_WORKSPACE/SDL2-2.32.10/x86_64-w64-mingw32/lib/cmake/SDL2" >> "$GITHUB_ENV"

      - name: Configure Windows build
        run: |
          cmake \
            -S . \
            -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=packaging/windows/mingw-w64-x86_64.cmake \
            -DSDL2_DIR="$SDL2_DIR" \
            -DCM0102_EXE="$GAME_EXE" \
            -DRECOMP_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build Bosman Windows executable
        run: |
          cmake --build build-win -j 2 --target cm0102_recomp

      - name: Extract Owner Game willingness caller source
        run: |
          mkdir -p build-win/owner-game-diagnostics

          grep -R -n -B 120 -A 180 \
            -E 'f_00846920\(\)|0x008609f5|0x008c0215|0x004dd5bf|f_007ff270\(\)' \
            build-win/recomp/gen \
            > build-win/owner-game-diagnostics/willingness-callers-context.txt || true

          grep -Rl -E 'f_00846920\(\);|void f_007ff270\(void\)' build-win/recomp/gen/fn_*.c | while read -r f; do
            cp "$f" build-win/owner-game-diagnostics/
          done

          TARGET=$(grep -Rl '^void f_007ff270(void)' build-win/recomp/gen/fn_*.c | head -1)
          if [ -n "$TARGET" ]; then
            echo "f_007ff270 definition: $TARGET"
            cp "$TARGET" build-win/owner-game-diagnostics/
            grep -n -A 500 '^void f_007ff270(void)' "$TARGET" \
              > build-win/owner-game-diagnostics/f_007ff270-context.txt || true
          else
            echo "Could not locate f_007ff270 definition"
            exit 1
          fi

          BASIC=$(grep -Rl '^void f_004e06e0(void)' build-win/recomp/gen/fn_*.c | head -1)
          if [ -n "$BASIC" ]; then
            echo "f_004e06e0 definition: $BASIC"
            cp "$BASIC" build-win/owner-game-diagnostics/
            grep -n -A 12000 '^void f_004e06e0(void)' "$BASIC" \
              > build-win/owner-game-diagnostics/f_004e06e0-basic-tab.txt || true
          else
            echo "Could not locate f_004e06e0 definition"
            exit 1
          fi

          cp build-win/recomp/gen/functions.h build-win/owner-game-diagnostics/
          echo "Diagnostic files:"
          ls -lah build-win/owner-game-diagnostics
          echo "Interest scorer call sites:"
          grep -R -n 'f_00846920();' build-win/recomp/gen/fn_*.c || true

      - name: Check executable exists
        run: |
          ls -lh build-win/cm0102_recomp.exe
          file build-win/cm0102_recomp.exe

      - name: Package Owner Game negotiation prototype
        run: |
          mkdir -p build-win/owner-game-package
          cp build-win/cm0102_recomp.exe build-win/owner-game-package/
          cp tools/owner-game/OwnerGameNegotiation.bat build-win/owner-game-package/
          echo "Owner Game negotiation package:"
          ls -lah build-win/owner-game-package

      - name: Save willingness diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Owner-Game-Willingness-Diagnostics
          path: build-win/owner-game-diagnostics
          if-no-files-found: error

      - name: Save Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Owner-Game-Bosman-Windows
          path: build-win/owner-game-package
          if-no-files-found: error
