name: Owner Game Fast Source Checks

on:
  workflow_dispatch:
  push:
    branches:
      - owner-game-offer-roundtrip
      - owner-game-active-dev
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/owner-game-fast-source-checks.yml'

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact change
        uses: actions/checkout@v4
      - name: Compile changed native C bridges for syntax and include correctness
        run: |
          set -eu
          cc -std=c11 -fsyntax-only -Isrc/recomp_rt -Isrc/recomp_rt/win \
            src/recomp_rt/win/owner_game_manager_trace.c \
            src/recomp_rt/win/owner_game_contract_submit_trace.c \
            src/recomp_rt/win/owner_game.c \
            src/recomp_rt/win/holiday_next.c
      - name: Validate native lifecycle and Manager Desk Python tests
        run: |
          set -eu
          python3 -m py_compile \
            tests/owner_game/manager_trace_parity.py \
            tests/owner_game/offer_delayed_lifecycle.py \
            tests/owner_game/offer_roundtrip.py \
            tests/owner_game/bridge_smoke.py \
            tests/owner_game/test_manager_desk_wiring.py \
            tests/owner_game/manager_desk_native_commands.py
      - name: Validate fast development and cached integration workflow
        run: python3 tests/owner_game/test_ci_workflows.py
      - name: Check Manager Desk action is authenticated and enters the native game only at a safe point
        run: python3 tests/owner_game/test_manager_desk_wiring.py
      - name: Ensure Manager Desk wraps verified native methods and never substitutes football outcomes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/recomp_rt/win/owner_game_manager_trace.c").read_text()
          functions = Path("docs/research/function-map/manager_manager.cpp.md").read_text()
          checks = {
              "0069ba50": "add_job_vacancy",
              "0069ebc0": "appoint_manager_to_club",
              "0069b790": "remove_club_manager",
              "006a8810": "handle_board_request",
              "0068f9c0": "daily_update",
          }
          for address, name in checks.items():
              assert f"RT_WRAP({address}," in source, address
              assert f"0x{int(address, 16):x}" in functions, address
              assert name in functions, name
          assert "RECOMP_OWNER_MANAGER_TRACE" in source
          assert "native_decision_unclassified" in source
          assert "appointment_called_unclassified" in source
          print("PASS native Manager Desk integration addresses and conservative event classifications")
          PY
