name: Owner Game Persistence Trace Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - owner-game-live-bridge

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Get Bosman source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64 p7zip-full python3-venv nsis curl

      - name: Install Python Capstone
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install capstone

      - name: Download official Bosman 0.6.0 game files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0 \
            --repo maxevans60/cm0102-bosman-edition \
            --pattern "CM0102-Bosman-Edition-0.6.0-Setup.exe" \
            --output bosman-setup.exe
          mkdir extracted
          7z x bosman-setup.exe -oextracted -y >/dev/null
          GAME_EXE=$(find extracted -type f -iname "cm0102.exe" | head -1)
          test -n "$GAME_EXE"
          echo "GAME_EXE=$GAME_EXE" >> "$GITHUB_ENV"

      - name: Download Windows SDL2
        run: |
          curl -L -o SDL2-devel.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
          tar -xzf SDL2-devel.tar.gz
          echo "SDL2_DIR=$GITHUB_WORKSPACE/SDL2-2.32.10/x86_64-w64-mingw32/lib/cmake/SDL2" >> "$GITHUB_ENV"

      - name: Configure Windows build
        run: |
          cmake -S . -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=packaging/windows/mingw-w64-x86_64.cmake \
            -DSDL2_DIR="$SDL2_DIR" \
            -DCM0102_EXE="$GAME_EXE" \
            -DRECOMP_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build persistence trace executable
        run: |
          cmake --build build-win -j 2 --target cm0102_recomp
          test -f build-win/cm0102_recomp.exe

      - name: Package Owner Game persistence trace
        run: |
          mkdir -p build-win/owner-game-trace-package
          cp build-win/cm0102_recomp.exe build-win/owner-game-trace-package/
          cp tools/owner-game/OwnerGameNegotiation.bat build-win/owner-game-trace-package/
          printf '%s\n' \
            'Owner Game - Figo contract persistence trace' \
            '' \
            '1. Close CM completely.' \
            '2. Copy cm0102_recomp.exe and OwnerGameNegotiation.bat into the Owner Game test folder, replacing the old EXE.' \
            '3. Start the new EXE and load Owner_Figo_Negotiation.' \
            '4. Before clicking Negotiate, run OwnerGameNegotiation.bat and choose 2 - Approve Exception.' \
            '5. In CM, negotiate £150,000 p/w and the maximum signing-on fee CM permits.' \
            '6. Submit the offer through the final CM confirmation screen.' \
            '7. Do not progress days yet.' \
            '8. Close CM after the submission test and send owner-game-contract-submit.log from the CM user folder.' \
            '' \
            'The trace does not force acceptance or rejection. It records whether native CM creates/removes the pending Figo -> Aston Villa contract offer.' \
            > build-win/owner-game-trace-package/READ-ME-FIRST.txt
          ls -lah build-win/owner-game-trace-package

      - name: Save persistence trace build
        uses: actions/upload-artifact@v4
        with:
          name: Owner-Game-Persistence-Trace-Windows
          path: build-win/owner-game-trace-package
          if-no-files-found: error
